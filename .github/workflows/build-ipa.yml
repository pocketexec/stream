name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: StreamPrep-iOS
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iPhone app (unsigned)
        run: |
          xcodebuild \
            -project StreamPrep.xcodeproj \
            -scheme StreamPrep \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StreamPrep.app Payload/
          zip -qry StreamPrep-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: StreamPrep-unsigned-ipa
          path: StreamPrep-iOS/StreamPrep-unsigned.ipa
